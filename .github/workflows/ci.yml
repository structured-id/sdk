# Both language implementations run against the same pinned schema and
# corpus (the `proto` submodule). On main they run whenever either
# implementation, the pinned revision or this workflow changes. Every pull
# request runs them: `rust` and `typescript` are required checks, and a
# required check that never reports keeps the pull request from merging.
name: CI

on:
  push:
    branches: [main]
    paths:
      - rust/**
      - typescript/**
      - proto
      - .gitmodules
      - .github/workflows/ci.yml
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    services:
      # The PostgreSQL the opt-in database decoding tests use.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sid
          POSTGRES_PASSWORD: sid_dev
          POSTGRES_DB: sid
        ports:
          - 54399:5432
        options: >-
          --health-cmd "pg_isready -U sid" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      # The runner image's stable may lag; `rustup update` brings the latest.
      - name: Latest stable toolchain and the no_std target
        run: rustup update stable --no-self-update && rustup target add thumbv7em-none-eabihf
      # The end-to-end tests build the issuer, whose schemas need protoc.
      - name: protoc with the well-known types
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler libprotobuf-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo nextest run --locked --workspace --all-features
      - run: cargo test --locked --doc --workspace --all-features
      - name: no_std + alloc
        run: |
          cargo check --locked -p sid-ids --target thumbv7em-none-eabihf --no-default-features --features alloc
          cargo check --locked -p sid-ids-proto --target thumbv7em-none-eabihf --no-default-features
      - name: Dependency isolation, packages and checkouts without symbolic links
        run: ci/check-isolation.sh all

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack install
      - run: yarn install --immutable
      # Packages import each other's build (proto imports ids), so the
      # workspace is built in dependency order before it is checked.
      - run: yarn build
      - run: yarn format:check
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      - name: Packed package in a clean consumer
        run: ci/check-package.sh
