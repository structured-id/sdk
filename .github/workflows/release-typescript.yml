# TypeScript packages of typescript/packages: release-please keeps a release
# PR per package with the next version and changelog from conventional commits
# touching it; merging one tags `typescript-<package>-v<version>` and creates
# the GitHub release, and the publish job publishes that package to npm. It
# never touches the Rust packages.
name: Release (TypeScript)

on:
  push:
    branches: [main]
    paths:
      - typescript/**
      - release-please-config.json
      - .release-please-manifest.json
      - .github/workflows/release-typescript.yml
  # Publish an existing release again (after a failed publish), by its tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. typescript-ids-v0.1.0
        required: true

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.released.outputs.tags }}
    steps:
      - name: Generate release token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASER_CLIENT_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # The tags released by this run. The publish script orders dependencies
      # within one job, rather than relying on matrix scheduling.
      - name: Released tags
        id: released
        env:
          OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        run: |
          tags="$(jq -c '. as $out | [to_entries[]
            | select((.key | endswith("--release_created")) and (.value | tostring) == "true")
            | $out[(.key | rtrimstr("--release_created")) + "--tag_name"]]' <<<"$OUTPUTS")"
          echo "tags=${tags}" >>"$GITHUB_OUTPUT"

  publish:
    needs: release-please
    if: >-
      always() && (github.event_name == 'workflow_dispatch'
      || (needs.release-please.outputs.tags != '' && needs.release-please.outputs.tags != '[]'))
    runs-on: ubuntu-latest
    # npm trusted publishing (OIDC) is bound to this workflow file and the
    # `release` environment: npmjs.com → @structured-id/<package> → Trusted
    # Publishers: structured-id / sdk / release-typescript.yml / release.
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      TAGS: ${{ needs.release-please.outputs.tags }}
      DISPATCH_TAG: ${{ inputs.tag }}
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - run: corepack enable
      # The registry is configured and no NODE_AUTH_TOKEN is set, so npm
      # authenticates by exchanging the job's OIDC token. No package cache in
      # a publish job.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # `yarn pack` replaces the workspace: ranges with the released versions;
      # npm then publishes that archive with provenance.
      - name: Publish to npm
        env:
          NPM_CONFIG_LOGLEVEL: verbose
        run: bash ci/publish-typescript.sh
