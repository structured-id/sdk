# TypeScript packages of typescript/packages: release-please keeps a release
# PR per package with the next version and changelog from conventional commits
# touching it; merging one tags `typescript-<package>-v<version>` and creates
# the GitHub release, and the publish job publishes that package to npm. It
# never touches the Rust packages.
name: Release (TypeScript)

on:
  push:
    branches: [main]
    paths:
      - typescript/**
      - release-please-config.json
      - .release-please-manifest.json
      - .github/workflows/release-typescript.yml
  # Publish an existing release again (after a failed publish), by its tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. typescript-ids-v0.1.0
        required: true

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.released.outputs.tags }}
    steps:
      - name: Generate release token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASER_CLIENT_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # The tags of the packages released by this run, in name order, so a
      # package is published before the packages that depend on it (ids
      # before proto).
      - name: Released tags
        id: released
        env:
          OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        run: |
          tags="$(jq -c '. as $out | [to_entries[]
            | select((.key | endswith("--release_created")) and (.value | tostring) == "true")
            | $out[(.key | rtrimstr("--release_created")) + "--tag_name"]] | sort' <<<"$OUTPUTS")"
          echo "tags=${tags}" >>"$GITHUB_OUTPUT"

  publish:
    needs: release-please
    if: >-
      always() && (github.event_name == 'workflow_dispatch'
      || (needs.release-please.outputs.tags != '' && needs.release-please.outputs.tags != '[]'))
    runs-on: ubuntu-latest
    strategy:
      # One package at a time, in the order above.
      max-parallel: 1
      matrix:
        tag: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.tag) || needs.release-please.outputs.tags) }}
    # npm trusted publishing (OIDC) is bound to this workflow file and the
    # `release` environment: npmjs.com → @structured-id/<package> → Trusted
    # Publishers: structured-id / sdk / release-typescript.yml / release.
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ matrix.tag }}
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          submodules: recursive
          persist-credentials: false
      - run: corepack enable
      # The registry is configured and no NODE_AUTH_TOKEN is set, so npm
      # authenticates by exchanging the job's OIDC token. No package cache in
      # a publish job.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: corepack install
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn test
      # `yarn pack` replaces the workspace: ranges with the released versions;
      # npm then publishes that archive with provenance.
      - name: Publish to npm
        env:
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          PACKAGE="${TAG#typescript-}"
          PACKAGE="${PACKAGE%-v*}"
          DIR="packages/${PACKAGE}"
          if [ ! -f "${DIR}/package.json" ]; then
            echo "Release tag ${TAG} names no package under typescript/packages."
            exit 1
          fi
          NAME="$(node -p "require('./${DIR}/package.json').name")"
          PV="$(node -p "require('./${DIR}/package.json').version")"
          if [ "${TAG}" != "typescript-${PACKAGE}-v${PV}" ]; then
            echo "Release tag ${TAG} does not name ${NAME} ${PV}."
            exit 1
          fi
          if npm view "${NAME}@${PV}" version >/dev/null 2>&1; then
            echo "${NAME}@${PV} is already published; nothing to do."
            exit 0
          fi
          yarn workspace "${NAME}" pack --out "${RUNNER_TEMP}/package.tgz"
          npm publish "${RUNNER_TEMP}/package.tgz" --access public --provenance
