[package]
name = "sid-ids"
description = "StructuredID validated identifiers: UUIDv7 newtypes (ProfileId, DeviceId, SessionId, MachineUserId) with checked construction, parsing, serde and database decoding"
readme = "README.md"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["structuredid", "identifier", "uuid", "uuidv7", "no-std"]
categories = ["no-std", "data-structures"]

[features]
default = ["std", "serde"]
# Fresh identifiers (`generate()`) need the system clock and a random source.
std = ["alloc", "uuid/std", "uuid/v7"]
# Owned-string conversions (`TryFrom<String>`); the hard minimum for a no_std consumer with an allocator.
alloc = []
serde = ["dep:serde", "uuid/serde"]
# Database decoding validates on read: a corrupted or wrong-version id is an error, never a default.
sqlx-postgres = ["std", "dep:sqlx", "sqlx/postgres"]
sqlx-sqlite = ["std", "dep:sqlx", "sqlx/sqlite"]

[dependencies]
uuid = { workspace = true }
serde = { version = "1", default-features = false, optional = true }
sqlx = { workspace = true, optional = true }

[[test]]
name = "sqlx_decode"
required-features = ["sqlx-postgres", "sqlx-sqlite"]

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true, features = ["postgres", "sqlite", "runtime-tokio"] }
