[workspace]
resolver = "3"
members = ["crates/sid-client", "crates/sid-ids", "crates/sid-ids-proto"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/structured-id/sdk"
authors = ["StructuredID Contributors"]

[workspace.dependencies]
prost = { version = "0.14", default-features = false }
prost-reflect = { version = "0.16", features = ["serde"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["uuid"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", default-features = false }

# The end-to-end tests build the SID issuer from its repository; its OPAQUE
# crates come from the same tree, as the issuer's own workspace takes them.
# Nothing published depends on them.
[patch.crates-io]
sid-opaque-ke = { git = "https://github.com/structured-id/sid", branch = "main" }
sid-voprf = { git = "https://github.com/structured-id/sid", branch = "main" }
# The issuer takes the identifier crates of this workspace, not their
# published copies: one sid-ids and one sid-ids-proto in the graph, so
# packaging them beside it finds no second source of the same version.
sid-ids = { path = "crates/sid-ids" }
sid-ids-proto = { path = "crates/sid-ids-proto" }
